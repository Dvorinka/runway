<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUNWAY — APRON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDECE7;
    --panel: #F7F6F2;
    --line: #D6D4CC;
    --ink: #191B1F;
    --dim: #6E6A5F;
    --faint: #A4A094;
    --brand: #FF4D00;
    --bad: #C23B2E;
    --ok: #2E7D46;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:"Geist", ui-sans-serif, system-ui, sans-serif;
    font-size:13px; min-height:100vh;
  }
  .mono { font-family:"Geist Mono", ui-monospace, monospace; }
  ::selection { background:var(--brand); color:#fff; }

  header {
    height:46px; display:flex; align-items:center; gap:18px;
    padding:0 22px; border-bottom:1px solid var(--line);
    background:var(--panel); position:sticky; top:0; z-index:10;
  }
  .logo { display:flex; align-items:center; gap:8px; font-weight:600; font-size:13.5px; }
  .crumb { color:var(--faint); font-size:12px; }
  .crumb b { color:var(--ink); font-weight:600; }
  header .sp { flex:1; }
  .seg { display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:#fff; }
  .seg button {
    font:inherit; font-family:"Geist Mono"; font-size:11px; border:none; background:transparent;
    padding:5px 12px; cursor:pointer; color:var(--dim);
  }
  .seg button.on { background:var(--ink); color:#fff; }
  .avatar { width:24px; height:24px; border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; font-size:10px; font-weight:600; }

  main { max-width:1240px; margin:0 auto; padding:24px 22px 60px; }

  .title-row { display:flex; align-items:baseline; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  .title-row h1 { font-size:19px; font-weight:600; letter-spacing:-.01em; }
  .title-row .sub { color:var(--dim); font-size:12px; }
  .legend { margin-left:auto; display:flex; gap:14px; font-family:"Geist Mono"; font-size:10px; letter-spacing:.08em; color:var(--dim); }
  .legend i { display:inline-block; width:18px; height:8px; border-radius:2px; margin-right:5px; vertical-align:-1px; font-style:normal; }
  .lg-landed { background:var(--ink); }
  .lg-live { background:repeating-linear-gradient(45deg, var(--brand) 0 4px, #FF8A52 4px 8px); }
  .lg-held { border:1.5px dashed var(--faint); }
  .lg-div { border:1.5px solid var(--bad); }

  /* ===== BOARD ===== */
  .board {
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    display:grid; grid-template-columns:150px 1fr;
    overflow:hidden; position:relative;
  }
  .lanes { border-right:1px solid var(--line); }
  .axis { border-bottom:1px solid var(--line); display:flex; }
  .axis .cell {
    flex:1; font-family:"Geist Mono"; font-size:9.5px; color:var(--faint);
    padding:8px 0 7px 8px; border-left:1px solid var(--line); letter-spacing:.06em;
  }
  .axis-spacer { border-bottom:1px solid var(--line); }
  .lane {
    height:74px; border-bottom:1px solid var(--line); padding:10px 14px;
    display:flex; flex-direction:column; justify-content:center; gap:3px;
  }
  .lane:last-child { border-bottom:none; }
  .lane .ln { font-family:"Geist Mono"; font-weight:600; font-size:11px; letter-spacing:.14em; }
  .lane .ln small { color:var(--faint); font-weight:400; display:block; letter-spacing:.04em; }
  .lane.hold-lane .ln { color:var(--dim); }

  .field { position:relative; display:flex; flex-direction:column; }
  .f-axis { border-bottom:1px solid var(--line); display:flex; height:30px; }
  .f-axis .cell { flex:1; border-left:1px solid var(--line); position:relative; }
  .f-lane { height:74px; border-bottom:1px solid var(--line); position:relative; }
  .f-lane:last-child { border-bottom:none; }
  .f-lane .grid { position:absolute; inset:0; display:flex; pointer-events:none; }
  .f-lane .grid i { flex:1; border-left:1px solid rgba(25,27,31,.05); }
  .now {
    position:absolute; top:0; bottom:0; width:2px; background:var(--brand); z-index:2;
  }
  .now::before {
    content:"NOW"; position:absolute; top:-1px; left:5px; font-family:"Geist Mono";
    font-size:8px; color:var(--brand); letter-spacing:.1em; font-weight:600;
    writing-mode:vertical-rl;
  }

  .bar {
    position:absolute; top:50%; transform:translateY(-50%);
    height:34px; border-radius:6px; cursor:pointer;
    display:flex; align-items:center; gap:7px; padding:0 10px;
    font-family:"Geist Mono"; font-size:10px; font-weight:600; letter-spacing:.05em;
    white-space:nowrap; transition:box-shadow .12s;
    overflow:hidden; min-width:118px;
  }
  .bar:hover { box-shadow:0 4px 12px rgba(25,27,31,.25); z-index:3; }
  .bar.sel { outline:2px solid var(--brand); outline-offset:2px; z-index:3; }
  .bar.landed { background:var(--ink); color:#fff; }
  .bar.live {
    background:repeating-linear-gradient(45deg, var(--brand) 0 8px, #FF7A33 8px 16px);
    color:#fff; animation:march 1s linear infinite;
  }
  @keyframes march { to { background-position:22.6px 0; } }
  .bar.held { background:transparent; border:1.5px dashed var(--faint); color:var(--dim); }
  .bar.diverted { background:rgba(194,59,46,.08); border:1.5px solid var(--bad); color:var(--bad); }
  .bar .env-tag { opacity:.65; font-weight:400; }

  /* ===== UNDER-BOARD ===== */
  .under { display:grid; grid-template-columns:1.4fr 1fr; gap:18px; margin-top:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  .card h2 { font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); font-family:"Geist Mono"; margin-bottom:12px; }
  .selcard .hd { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .selcard .hd .cs { font-family:"Geist Mono"; font-weight:600; font-size:15px; }
  .selcard .hd .st { font-family:"Geist Mono"; font-size:9.5px; letter-spacing:.1em; font-weight:600; padding:2px 8px; border-radius:3px; text-transform:uppercase; }
  .st.landed { background:var(--ink); color:#fff; }
  .st.live { background:var(--brand); color:#fff; }
  .st.held { background:#fff; border:1px dashed var(--faint); color:var(--dim); }
  .st.diverted { background:var(--bad); color:#fff; }
  .selcard .kv { display:grid; grid-template-columns:96px 1fr; gap:5px 12px; font-size:12px; }
  .selcard .k { color:var(--faint); font-family:"Geist Mono"; font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding-top:1px; }
  .selcard .v { font-family:"Geist Mono"; font-size:11.5px; }
  .selcard .btns { display:flex; gap:8px; margin-top:14px; }
  .tbtn {
    font:inherit; font-size:11.5px; font-weight:500; padding:6px 12px; border-radius:6px;
    border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer;
  }
  .tbtn:hover { border-color:var(--ink); }
  .tbtn.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  .tbtn.primary:hover { background:#000; }

  .spark { display:flex; align-items:flex-end; gap:3px; height:64px; margin-top:4px; }
  .spark i { flex:1; background:var(--line); border-radius:2px 2px 0 0; min-height:4px; transition:.15s; }
  .spark i.today { background:var(--brand); }
  .statrow { display:flex; gap:24px; margin-top:14px; }
  .statrow .s .n { font-family:"Geist Mono"; font-weight:600; font-size:20px; }
  .statrow .s .l { font-size:10px; color:var(--dim); letter-spacing:.1em; text-transform:uppercase; font-family:"Geist Mono"; }

  @media (max-width: 900px) {
    .board { grid-template-columns:110px 1fr; }
    .under { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="19" height="19" viewBox="0 0 240 240"><g transform="translate(0 -14) rotate(22.5 120 120)"><g fill="none" stroke="#191B1F" stroke-width="18" stroke-linecap="round"><path d="M56 204 L196 64"/><path d="M44 160 C 94 160 122 140 150 110"/></g><circle cx="150" cy="110" r="13" fill="#FF4D00"/></g></svg>
    runway
  </div>
  <div class="crumb">devs-team <b>/ apron</b></div>
  <div class="sp"></div>
  <div class="seg" id="range">
    <button data-r="2">2H</button><button class="on" data-r="6">6H</button><button data-r="24">24H</button><button data-r="168">7D</button>
  </div>
  <div class="avatar">D</div>
</header>

<main>
  <div class="title-row">
    <h1>Apron</h1>
    <span class="sub">traffic board — deployments parked and in motion, by environment</span>
    <div class="legend">
      <span><i class="lg-landed"></i>LANDED</span>
      <span><i class="lg-live"></i>IN MOTION</span>
      <span><i class="lg-held"></i>HELD</span>
      <span><i class="lg-div"></i>DIVERTED</span>
    </div>
  </div>

  <div class="board">
    <div class="lanes">
      <div class="axis-spacer" style="height:31px"></div>
      <div class="lane"><div class="ln">PRODUCTION<small>env-prod · public</small></div></div>
      <div class="lane"><div class="ln">STAGING<small>env-staging</small></div></div>
      <div class="lane"><div class="ln">PREVIEW<small>branch · basicAuth</small></div></div>
      <div class="lane hold-lane"><div class="ln">HOLD / DIVERT<small>not on station</small></div></div>
    </div>
    <div class="field" id="field"></div>
  </div>

  <div class="under">
    <div class="card selcard" id="selcard"></div>
    <div class="card">
      <h2>Today's movement</h2>
      <div class="spark" id="spark"></div>
      <div class="statrow">
        <div class="s"><div class="n">9</div><div class="l">departures</div></div>
        <div class="s"><div class="n">96%</div><div class="l">success</div></div>
        <div class="s"><div class="n">1m04s</div><div class="l">median flight</div></div>
      </div>
    </div>
  </div>
</main>

<script>
const LANES = ["production","staging","preview","hold"];
const F = [
  {id:"RWY-9C1E", proj:"api",       env:"production", st:"final",    cls:"live",     start:.86, len:.05, commit:"fix: token refresh race",    alias:"api-devs-team.deploy.localhost",           dur:"48s",   health:"probe 200 OK · 214ms"},
  {id:"RWY-4F2A", proj:"storefront",env:"production", st:"landed",   cls:"landed",   start:.62, len:.09, commit:"feat: cart totals rework",  alias:"storefront-devs-team.deploy.localhost",    dur:"2m04s", health:"healthy · p95 214ms"},
  {id:"RWY-B3F9", proj:"landing",   env:"production", st:"landed",   cls:"landed",   start:.18, len:.04, commit:"chore: bump hero copy",     alias:"landing-devs-team.deploy.localhost",       dur:"38s",   health:"static publish"},
  {id:"RWY-8C31", proj:"api",       env:"production", st:"landed",   cls:"landed",   start:.05, len:.07, commit:"chore: deps bump",          alias:"api-devs-team.deploy.localhost",           dur:"1m12s", health:"retained — rollback target"},
  {id:"RWY-F044", proj:"docs",      env:"production", st:"landed",   cls:"landed",   start:.38, len:.03, commit:"fix: nav anchors",          alias:"docs-devs-team.deploy.localhost",          dur:"26s",   health:"superseded"},
  {id:"RWY-2E8C", proj:"storefront",env:"staging",    st:"held",     cls:"held",     start:.80, len:.10, commit:"wip: checkout experiments", alias:"storefront-env-staging.deploy.localhost",  dur:"—",     health:"queue depth 1"},
  {id:"RWY-77BD", proj:"docs",      env:"preview",    st:"climb",    cls:"live",     start:.90, len:.06, commit:"docs: self-hosting guide",  alias:"docs-branch-docs.deploy.localhost",        dur:"31s",   health:"build 41%"},
  {id:"RWY-A110", proj:"api",       env:"hold",       st:"diverted", cls:"diverted", start:.55, len:.06, commit:"feat: retry scheduler",     alias:"api-id-a1104f.deploy.localhost",           dur:"1m31s", health:"runner OOM · strip kept"},
];

let sel = 0, range = 6;
const field = document.getElementById('field');

function hourTicks() {
  const now = new Date();
  const ticks = [];
  for (let i = range; i >= 0; i--) {
    const d = new Date(now - i * 3600e3);
    ticks.push(d.getHours().toString().padStart(2,'0') + ':00');
  }
  return ticks;
}

function render() {
  const ticks = hourTicks();
  const n = ticks.length - 1;
  let html = `<div class="f-axis">${ticks.map(t => `<div class="cell"><span class="mono" style="position:absolute;left:6px;top:9px;font-size:9.5px;color:var(--faint)">${t}</span></div>`).join('')}</div>`;
  LANES.forEach(lane => {
    html += `<div class="f-lane"><div class="grid">${'<i></i>'.repeat(n)}</div>`;
    F.filter(f => f.env === lane).forEach(f => {
      const l = f.start * 100, w = Math.max(f.len * 100, 4);
      html += `<div class="bar ${f.cls} ${F.indexOf(f) === sel ? 'sel' : ''}" data-i="${F.indexOf(f)}"
        style="left:${l}%;width:${w}%">${f.id}<span class="env-tag">${f.proj}</span></div>`;
    });
    html += `</div>`;
  });
  field.innerHTML = html + `<div class="now" style="left:calc(100% - 2px)"></div>`;
  [...field.querySelectorAll('.bar')].forEach(el => el.onclick = () => { sel = +el.dataset.i; render(); renderCard(); });
}
function renderCard() {
  const f = F[sel];
  const label = {landed:'LANDED', live: f.st === 'final' ? 'ON FINAL' : 'CLIMBING', held:'HELD', diverted:'DIVERTED'}[f.cls];
  document.getElementById('selcard').innerHTML = `
    <h2>Selected flight</h2>
    <div class="hd"><span class="cs">${f.id}</span><span class="st ${f.cls}">${label}</span></div>
    <div class="kv">
      <div class="k">Route</div><div class="v">${f.proj} → ${f.env}</div>
      <div class="k">Commit</div><div class="v">${f.commit}</div>
      <div class="k">Alias</div><div class="v">${f.alias}</div>
      <div class="k">Duration</div><div class="v">${f.dur}</div>
      <div class="k">Health</div><div class="v">${f.health}</div>
    </div>
    <div class="btns">
      <button class="tbtn primary">Open logs</button>
      <button class="tbtn">Visit URL</button>
      <button class="tbtn">Rollback env</button>
    </div>`;
}
document.getElementById('range').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  range = +e.target.dataset.r;
  [...e.currentTarget.children].forEach(b => b.classList.toggle('on', b === e.target));
  render();
});
document.getElementById('spark').innerHTML =
  [...Array(16)].map((_, i) => `<i style="height:${8 + Math.abs(Math.sin(i * 2.3)) * 56}px" class="${i === 15 ? 'today' : ''}"></i>`).join('');
render(); renderCard();
</script>
</body>
</html>
