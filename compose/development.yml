# Development stack: runway + postgres + traefik.
# Usage:  HOST_DATA_DIR=$PWD/data docker compose -f compose/development.yml up -d --build
#         docker compose -f compose/development.yml exec runway runway bootstrap --email you@x.dev
#
# HOST_DATA_DIR must be an ABSOLUTE host path: the app hands data subpaths
# (uploads, build contexts, static output) to the Docker API, which needs
# host paths, not container paths. The same directory is bind-mounted below.
# DISABLE_TLS is on for local dev (plain http on :8000, traefik on :80).

services:
  pgsql:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: runway
      POSTGRES_PASSWORD: runway
      POSTGRES_DB: runway
    volumes:
      - runway-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runway -d runway"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Privilege boundary for the Docker API (parity with devpush): this is
  # the only service that mounts the raw socket. Runway talks to it over
  # TCP as an unprivileged user instead of needing socket group access.
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      SYSTEM: 1
      POST: 1
      EXEC: 1
      NETWORKS: 1
      VOLUMES: 1
      DISABLE_IPV6: 1

  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/traefik
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # ACME fallback path (direct-IP hosting). Harmless when DISABLE_TLS
      # is set — routers only reference `le` when url_scheme is https.
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.le.acme.storage=/traefik/acme.json
    ports:
      - "8080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOST_DATA_DIR:?set HOST_DATA_DIR to an absolute host path, e.g. HOST_DATA_DIR=$PWD/data}/traefik:/traefik
    labels:
      - traefik.enable=true

  runway:
    build: ..
    restart: unless-stopped
    depends_on:
      pgsql:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    environment:
      APP_HOSTNAME: ${APP_HOSTNAME:-runway.localhost}
      DEPLOY_DOMAIN: ${DEPLOY_DOMAIN:-deploy.localhost}
      DATABASE_URL: postgres://runway:runway@pgsql:5432/runway
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-change-me}
      DISABLE_TLS: "true"
      RUNWAY_ENV: development
      DATA_DIR: /home/runway/data
      RUNWAY_LISTEN: 0.0.0.0:8000
      # Runner containers need to reach us back via the workspace network.
      # Absolute host path of the data dir (== the volume below).
      DOCKER_HOST: tcp://docker-proxy:2375
      HOST_DATA_DIR: ${HOST_DATA_DIR:?set HOST_DATA_DIR to an absolute host path}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_NAME: ${GITHUB_APP_NAME:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      # CGNAT path — set both to auto-manage the instance tunnel.
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
    ports:
      - "8000:8000"
    volumes:
      - ${HOST_DATA_DIR:?set HOST_DATA_DIR to an absolute host path}:/home/runway/data
    # Router for APP_HOSTNAME — the tunnel ingress targets traefik:80.
    labels:
      - traefik.enable=true
      - traefik.http.routers.runway.rule=Host(`${APP_HOSTNAME:-runway.localhost}`)
      - traefik.http.routers.runway.service=runway
      - traefik.http.routers.runway.entrypoints=web
      - traefik.http.services.runway.loadbalancer.server.port=8000

volumes:
  runway-db:
