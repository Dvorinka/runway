name: Feature request
description: Suggest a capability, integration, or UX improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case — what are you trying to do that Runway can't today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How should it work? Config keys, UI, API surface — as concrete as you like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you're using now, or how other platforms handle it.
  - type: checkboxes
    id: scope
    attributes:
      label: Areas
      options:
        - label: Deploy pipeline / presets
        - label: Edge / domains / TLS
        - label: Auth / teams / RBAC
        - label: CLI / MCP / API
        - label: Dashboard
        - label: Remote nodes
