name: release

on:
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/dvorinka/runway

jobs:
  binaries:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, name: linux-x64, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, name: linux-arm64, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, name: darwin-x64, os: macos-14 }
          - { target: aarch64-apple-darwin, name: darwin-arm64, os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross toolchain (linux-arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release -p runway --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/runway dist/
          tar -czf runway-${{ matrix.name }}.tar.gz -C dist runway
      - uses: softprops/action-gh-release@v2
        with:
          files: runway-${{ matrix.name }}.tar.gz

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
