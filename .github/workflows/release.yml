name: release

# Runs on every merge to main. If Cargo.toml's version has no matching
# vX.Y.Z tag yet, it cuts the release: GitHub release + binaries + GHCR image.
# Pushing a v* tag manually also works. Docs-only merges are skipped.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/dvorinka/runway

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      major_minor: ${{ steps.v.outputs.major_minor }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          release=true
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            tag="v$ver"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              release=false
              echo "::notice::$tag already exists — skipping release"
            fi
          fi
          mm=$(echo "$tag" | sed -E 's/^v([0-9]+\.[0-9]+).*/\1/')
          { echo "tag=$tag"; echo "major_minor=$mm"; echo "release=$release"; } >> "$GITHUB_OUTPUT"

  binaries:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, name: linux-x64, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, name: linux-arm64, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, name: darwin-x64, os: macos-14 }
          - { target: aarch64-apple-darwin, name: darwin-arm64, os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross toolchain (linux-arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          # GH mirrors carry amd64 only — pin them, then add ports for arm64
          sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' \
            /etc/apt/sources.list.d/ubuntu.sources
          printf 'Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports\nSuites: noble noble-updates noble-security\nComponents: main universe\nArchitectures: arm64\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' \
            | sudo tee /etc/apt/sources.list.d/arm64-ports.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libssl-dev:arm64
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          AARCH64_UNKNOWN_LINUX_GNU_OPENSSL_LIB_DIR: /usr/lib/aarch64-linux-gnu
          AARCH64_UNKNOWN_LINUX_GNU_OPENSSL_INCLUDE_DIR: /usr/include
        run: |
          cargo build --release -p runway --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/runway dist/
          tar -czf runway-${{ matrix.name }}.tar.gz -C dist runway
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: runway-${{ matrix.name }}.tar.gz

  # Per-arch native builds — no QEMU emulation (ubuntu-24.04-arm is a
  # native arm64 runner, free for public repos). `manifest` joins them.
  image:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: amd64, os: ubuntu-latest }
          - { platform: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:build-${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

  manifest:
    needs: [prepare, image]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          MM: ${{ needs.prepare.outputs.major_minor }}
          SHA: ${{ github.sha }}
        run: |
          for t in "$TAG" "$MM" latest "sha-${SHA::7}"; do
            docker buildx imagetools create -t "$IMAGE:$t" \
              "$IMAGE:build-amd64" "$IMAGE:build-arm64"
          done
          docker buildx imagetools inspect "$IMAGE:$TAG"
